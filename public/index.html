<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0e1615">
    <meta name="color-scheme" content="dark">
    <title>Reverb’s Reach — A new world is taking shape</title>
    <meta name="description" content="Some worlds stay with you. Reverb’s Reach is a new MMORPG in development, with desktop clients coming to Windows and macOS.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Reverb’s Reach">
    <meta property="og:description" content="A new MMORPG. A shared horizon. Coming to Windows and macOS.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="site">
      <div class="atmosphere" aria-hidden="true">
        <div class="echoes">
          <span style="--ring: 0"></span>
          <span style="--ring: 1"></span>
          <span style="--ring: 2"></span>
          <span style="--ring: 3"></span>
          <span style="--ring: 4"></span>
          <span style="--ring: 5"></span>
          <span style="--ring: 6"></span>
          <span style="--ring: 7"></span>
          <span style="--ring: 8"></span>
          <span style="--ring: 9"></span>
          <span style="--ring: 10"></span>
          <span style="--ring: 11"></span>
        </div>
      </div>

      <header class="site-header">
        <p class="wordmark">Reverb’s Reach</p>
        <p class="development-status"><span class="status-dot" aria-hidden="true"></span>In development</p>
      </header>

      <main class="hero">
        <p class="eyebrow">A new MMORPG. A shared horizon.</p>
        <h1>Some worlds<br><em>stay with you.</em></h1>
        <p class="introduction">Step into Reverb’s Reach.<br>Your next adventure is taking shape.</p>

        <div class="downloads" role="group" aria-label="Desktop clients, coming soon">
          <!-- Replace these disabled buttons with download links when builds are ready. -->
          <button class="download download-primary" type="button" disabled>
            <span class="download-copy">
              <span class="download-title">Windows client</span>
              <span class="download-detail">Coming soon</span>
            </span>
            <svg class="download-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M12 3v12m-5-5 5 5 5-5M5 20h14"></path>
            </svg>
          </button>
          <button class="download download-secondary" type="button" disabled>
            <span class="download-copy">
              <span class="download-title">macOS client</span>
              <span class="download-detail">Coming soon</span>
            </span>
            <svg class="download-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M12 3v12m-5-5 5 5 5-5M5 20h14"></path>
            </svg>
          </button>
        </div>
      </main>

      <footer class="site-footer">
        <p>Reverb’s Reach</p>
        <p class="footer-note">Desktop clients coming soon</p>
      </footer>
    </div>
  </body>
</html>
